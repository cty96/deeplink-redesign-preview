ath d="M430 249 L458 249" fill="none" stroke="#87A6D1" stroke-width="1.3" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M430 311 L458 311" fill="none" stroke="#87A6D1" stroke-width="1.3" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M383 268 L383 292" fill="none" stroke="#87A6D1" stroke-width="1.3" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M505 268 L505 292" fill="none" stroke="#87A6D1" stroke-width="1.3" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="444" y="364" font-size="14" fill="#345780" font-weight="400" text-anchor="middle">GPU B · 组内全互联</text><text x="28" y="424" font-size="15" fill="#345780" font-weight="400" text-anchor="start">异构芯片间，通信层通过在厂商通信库之上构建适配层完成。</text><text x="28" y="467" font-size="15" fill="#345780" font-weight="400" text-anchor="start">01  厂商实现的专用高性能通信库，都对自家硬件适配度更高、性能</text><text x="28" y="492" font-size="15" fill="#345780" font-weight="400" text-anchor="start">更强。</text><text x="28" y="533" font-size="15" fill="#345780" font-weight="400" text-anchor="start">02  对于依赖RoCE协议，或者IB网卡后网络协议相同的机器，</text><text x="28" y="558" font-size="15" fill="#345780" font-weight="400" text-anchor="start">协议保障了跨品牌芯片通信。</text><text x="28" y="599" font-size="15" fill="#345780" font-weight="400" text-anchor="start">03  芯片厂商不需要专门适配XCCL，只需要实现自身专用的集合</text><text x="28" y="624" font-size="15" fill="#345780" font-weight="400" text-anchor="start">通信库即可。</text></g></svg>