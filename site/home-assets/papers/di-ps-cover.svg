<svg xmlns="http://www.w3.org/2000/svg" width="380" height="566" viewBox="0 0 380 566" role="img" aria-label="Di-PS: System-Algorithm Co-Design for Asynchronous and Heterogeneous Cross-cluster LLM Training at Scale"><g fill="#ffffff" font-family="Arial, sans-serif"><text x="24" y="34" font-size="13" font-weight="600">NSDI &#x27;26</text><text x="354" y="34" text-anchor="end" font-size="13">2026</text><text x="24" y="220" font-size="22" font-weight="600">Di-PS: System-Algorithm Co-</text><text x="24" y="246" font-size="22" font-weight="600">Design for Asynchronous and</text><text x="24" y="272" font-size="22" font-weight="600">Heterogeneous Cross-cluster</text><text x="24" y="298" font-size="22" font-weight="600">LLM Training at Scale</text><text x="24" y="344" font-size="10.5" fill="#ffffff">Large language models (LLMs) have revolutionized</text><text x="24" y="357" font-size="10.5" fill="#ffffff">artificial intelligence, exhibiting remarkable</text><text x="24" y="370" font-size="10.5" fill="#ffffff">performance in various tasks. Training these models</text><text x="24" y="383" font-size="10.5" fill="#ffffff">demands extensive computational resources, which are</text><text x="24" y="396" font-size="10.5" fill="#ffffff">often economically and physically prohibitive. Cross-</text><text x="24" y="409" font-size="10.5" fill="#ffffff">cluster training can balance infrastructure costs,</text><text x="24" y="422" font-size="10.5" fill="#ffffff">alleviate physical and resource constraints, better</text><text x="24" y="435" font-size="10.5" fill="#ffffff">match workload demands, and sustain higher efficiency</text><text x="24" y="448" font-size="10.5" fill="#ffffff">through geodistributed deployment. However, challenges</text><text x="24" y="461" font-size="10.5" fill="#ffffff">arise from network variability, heterogeneous</text><text x="24" y="474" font-size="10.5" fill="#ffffff">computational resources, and intrinsic training</text><text x="24" y="487" font-size="10.5" fill="#ffffff">instability. To address these issues, we present Di-PS,</text><text x="24" y="500" font-size="10.5" fill="#ffffff">a novel framework for cross-cluster LLM training at</text></g></svg>