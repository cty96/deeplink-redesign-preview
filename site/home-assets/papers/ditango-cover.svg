<svg xmlns="http://www.w3.org/2000/svg" width="380" height="566" viewBox="0 0 380 566" role="img" aria-label="DiTango: Cost-Effective Parallel Diffusion Generation with Selective Attention State Reuse"><g fill="#ffffff" font-family="Arial, sans-serif"><text x="24" y="34" font-size="13" font-weight="600">HPDC &#x27;26</text><text x="354" y="34" text-anchor="end" font-size="13">2026</text><text x="24" y="220" font-size="22" font-weight="600">DiTango: Cost-Effective</text><text x="24" y="246" font-size="22" font-weight="600">Parallel Diffusion</text><text x="24" y="272" font-size="22" font-weight="600">Generation with Selective</text><text x="24" y="298" font-size="22" font-weight="600">Attention State Reuse</text><text x="24" y="344" font-size="10.5" fill="#ffffff">Recent advances in AI-generated content have driven</text><text x="24" y="357" font-size="10.5" fill="#ffffff">widespread adoption of Diffusion Transformers (DiTs)</text><text x="24" y="370" font-size="10.5" fill="#ffffff">for high-resolution, long-duration content generation.</text><text x="24" y="383" font-size="10.5" fill="#ffffff">While parallelization techniques accelerate diffusion</text><text x="24" y="396" font-size="10.5" fill="#ffffff">inference, they face significant scalability challenges</text><text x="24" y="409" font-size="10.5" fill="#ffffff">due to excessive communication overhead in multi-node</text><text x="24" y="422" font-size="10.5" fill="#ffffff">environments. We observe that sequence partitions in</text><text x="24" y="435" font-size="10.5" fill="#ffffff">Context Parallelism (CP) exhibit distinct</text><text x="24" y="448" font-size="10.5" fill="#ffffff">heterogeneity: spatially proximate partitions</text><text x="24" y="461" font-size="10.5" fill="#ffffff">contribute more significantly to attention computation</text><text x="24" y="474" font-size="10.5" fill="#ffffff">results. By mapping this heterogeneous pattern to</text><text x="24" y="487" font-size="10.5" fill="#ffffff">hierarchical communication topology, we can access</text><text x="24" y="500" font-size="10.5" fill="#ffffff">high-contribution partitions with reduced communication</text></g></svg>