<svg xmlns="http://www.w3.org/2000/svg" width="380" height="566" viewBox="0 0 380 566" role="img" aria-label="FlexLinearAttention: Compiling a Unified Abstraction into Scalable Kernels for Linear Attention"><g fill="#ffffff" font-family="Arial, sans-serif"><text x="24" y="34" font-size="13" font-weight="600">ICLR</text><text x="354" y="34" text-anchor="end" font-size="13">2026</text><text x="24" y="220" font-size="22" font-weight="600">FlexLinearAttention:</text><text x="24" y="246" font-size="22" font-weight="600">Compiling a Unified</text><text x="24" y="272" font-size="22" font-weight="600">Abstraction into Scalable</text><text x="24" y="298" font-size="22" font-weight="600">Kernels for Linear Attention</text><text x="24" y="344" font-size="10.5" fill="#ffffff">The quadratic complexity of softmax attention poses a</text><text x="24" y="357" font-size="10.5" fill="#ffffff">major bottleneck for long-context modeling, motivating</text><text x="24" y="370" font-size="10.5" fill="#ffffff">a surge of linear attention variants with linear</text><text x="24" y="383" font-size="10.5" fill="#ffffff">complexity. Unlike softmax attention, which benefits</text><text x="24" y="396" font-size="10.5" fill="#ffffff">from optimized kernels, linear attention lacks general-</text><text x="24" y="409" font-size="10.5" fill="#ffffff">purpose, hardware-efficient support and scalable</text><text x="24" y="422" font-size="10.5" fill="#ffffff">distributed implementations. We introduce Flexible</text><text x="24" y="435" font-size="10.5" fill="#ffffff">Linear Attention (FlexLA), a domain-specific compiler</text><text x="24" y="448" font-size="10.5" fill="#ffffff">that automates the generation of high-performance,</text><text x="24" y="461" font-size="10.5" fill="#ffffff">scalable kernels for a wide range of linear attention</text><text x="24" y="474" font-size="10.5" fill="#ffffff">models directly from high-level PyTorch code. At its</text><text x="24" y="487" font-size="10.5" fill="#ffffff">core, FlexLA employs an intuitive programming</text><text x="24" y="500" font-size="10.5" fill="#ffffff">abstraction that decomposes any linear attention</text></g></svg>